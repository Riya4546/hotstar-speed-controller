<!DOCTYPE html>
<html>

<head>
  <title>Hotstar Speed Controller</title>

  <style>
    body {
      width: 200px;
      padding: 10px;
      font-family: Arial;
      text-align: center;
    }

    button {
      width: 100%;
      margin: 5px 0;
      padding: 10px;
      font-size: 16px;
      cursor: pointer;

<body>

  <button id="speed2">2x</button>

  <script src="popup.js"></script>

</body>
</html>
